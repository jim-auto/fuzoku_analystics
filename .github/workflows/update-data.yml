name: Update data

on:
  schedule:
    - cron: "0 15 * * 0"  # 日曜 00:00 JST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch and aggregate data
        id: fetch
        continue-on-error: true
        run: python run.py

      - name: Commit updated data
        if: steps.fetch.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/public/summary.json docs/data/summary.json
          git diff --staged --quiet || git commit -m "Update analytics data"
          git push

      - name: Note on fetch failure
        if: steps.fetch.outcome != 'success'
        run: |
          echo "Fetch failed (often 403 from City Heaven on GitHub runners)."
          echo "Run 'python run.py' locally and push to update data."
